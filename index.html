<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Get Entry Pass</title>
  <!-- Preload bwip-js script for faster rendering -->
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/bwip-js@3.0.4/dist/bwip-js-min.js" as="script">
  <script src="https://cdn.jsdelivr.net/npm/bwip-js@3.0.4/dist/bwip-js-min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background: #ffffff;
      color: #000000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 340px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.022em;
      margin-bottom: 6px;
    }

    p {
      font-size: 13px;
      color: #8e8e93;
      line-height: 1.38;
      margin-bottom: 32px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px;
      border: 1px solid #e5e5ea;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      background: #f2f2f7;
      color: #000000;
      text-align: center;
      letter-spacing: 1px;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: #000000;
      background: #ffffff;
    }

    .btn-submit, .btn-reload {
      width: 100%;
      background: #000000;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      padding: 16px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .btn-reload {
      margin-top: 24px;
      background: #f2f2f7;
      color: #000000;
    }

    .btn-submit:active, .btn-reload:active {
      opacity: 0.8;
    }

    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #pass-container {
      display: none;
      margin-top: 12px;
      padding: 28px 20px;
      border: 1px solid #e5e5ea;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    canvas {
      max-width: 100%;
      height: auto;
      margin-top: 16px;
    }

    .name-label {
      font-size: 18px;
      font-weight: 700;
      color: #000000;
      margin-top: 14px;
    }

    .email-label {
      font-size: 13px;
      color: #8e8e93;
      margin-top: 4px;
      margin-bottom: 12px;
    }

    .id-label {
      font-size: 13px;
      font-weight: 600;
      color: #3a3a3c;
      letter-spacing: 1px;
      background: #f2f2f7;
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-block;
      margin-top: 8px;
    }

    #error-msg {
      color: #ff3b30;
      font-size: 13px;
      font-weight: 500;
      margin-top: 16px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="search-container">
      <h1>Get Entry Pass</h1>
      <p>Enter ID number below to generate event barcode ticket.</p>

      <div class="input-group">
        <input type="text" id="id-input" placeholder="Enter ID Number" required autocomplete="off" onkeydown="if(event.key === 'Enter') fetchPass()">
      </div>
      
      <button class="btn-submit" id="submit-btn" onclick="fetchPass()">View Barcode Pass</button>
      <div id="error-msg"></div>
    </div>

    <!-- Generated Pass Output -->
    <div id="pass-container">
      <h1>Event Pass</h1>
      <p>Screenshot this ticket for check-in</p>
      
      <div class="name-label" id="name-display"></div>
      <div class="email-label" id="email-display"></div>
      
      <canvas id="barcode-canvas"></canvas>
      <div>
        <span class="id-label" id="id-display"></span>
      </div>

      <button class="btn-reload" onclick="resetForm()">Search Another ID</button>
    </div>
  </div>

  <script>
  const API_URL = "https://script.google.com/macros/s/AKfycby671G8Skl7GRVhye9ehRMRKm0qDwtT8pH1r6ml1x5jEbywFMsyy68Mst3U2Fxf3iSs/exec";
  let isFetching = false;

  function fetchPass() {
    if (isFetching) return;

    const idInput = document.getElementById('id-input').value.trim();
    const errorDiv = document.getElementById('error-msg');
    const submitBtn = document.getElementById('submit-btn');

    if (!idInput) {
      showError("Please enter your Registration ID.");
      return;
    }

    isFetching = true;
    submitBtn.disabled = true;
    submitBtn.innerText = "Verifying...";
    errorDiv.style.display = "none";

    // Create unique JSONP callback
    const callbackName = 'jsonp_cb_' + Math.floor(Math.random() * 1000000);
    
    window[callbackName] = function(data) {
      cleanup(callbackName);

      if (data && data.success) {
        renderPass(data, idInput);
      } else {
        showError((data && data.message) ? data.message : "ID not found.");
      }
    };

    const script = document.createElement('script');
    script.id = callbackName;
    script.async = true;
    script.src = `${API_URL}?id=${encodeURIComponent(idInput)}&callback=${callbackName}`;
    script.onerror = function() {
      cleanup(callbackName);
      showError("Unable to retrieve pass. Please check your connection or access permissions.");
    };

    document.body.appendChild(script);
  }

  function cleanup(callbackName) {
    isFetching = false;
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = false;
    submitBtn.innerText = "View Barcode Pass";
    delete window[callbackName];
    const scriptTag = document.getElementById(callbackName);
    if (scriptTag) scriptTag.remove();
  }

  function renderPass(data, fallbackId) {
    document.getElementById('search-container').style.display = "none";
    document.getElementById('pass-container').style.display = "block";
    
    const id = data.id || fallbackId;
    document.getElementById('id-display').innerText = `ID: ${id}`;
    document.getElementById('name-display').innerText = data.name || "Attendee";
    document.getElementById('email-display').innerText = data.email || "";

    try {
      bwipjs.toCanvas('barcode-canvas', {
        bcid: 'code128',
        text: id,
        scale: 3,
        height: 12,
        includetext: false
      });
    } catch (e) {
      console.error("Barcode Generation Error:", e);
      showError("Error rendering barcode image.");
    }
  }

  function resetForm() {
    document.getElementById('pass-container').style.display = "none";
    document.getElementById('search-container').style.display = "block";
    const inputField = document.getElementById('id-input');
    inputField.value = "";
    inputField.focus();
    document.getElementById('error-msg').style.display = "none";
  }

  function showError(msg) {
    const errorDiv = document.getElementById('error-msg');
    errorDiv.innerText = msg;
    errorDiv.style.display = "block";
  }
  </script>
</body>
</html>
